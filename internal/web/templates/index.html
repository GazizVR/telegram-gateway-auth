<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация через Telegram Gateway — живая демонстрация</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand-pill">
      <span>⚡ Smart OTP Gateway</span>
    </div>
    <div class="controls">
      <div class="lang-switch" id="lang-switch" role="radiogroup" aria-label="Язык интерфейса">
        <span class="lang-thumb" aria-hidden="true"></span>
        <button type="button" class="lang-opt" role="radio" data-lang="ru" lang="ru" aria-checked="true" tabindex="0" title="Русский">RU</button>
        <button type="button" class="lang-opt" role="radio" data-lang="en" lang="en" aria-checked="false" tabindex="-1" title="English">EN</button>
        <button type="button" class="lang-opt" role="radio" data-lang="uz" lang="uz" aria-checked="false" tabindex="-1" title="Oʻzbekcha">UZ</button>
      </div>
      <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-pressed="false" aria-label="Тёмная тема" title="Тёмная тема">
        <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="tg-logo-wrap">
      <img src="/static/favicon.svg" alt="Smart OTP Gateway" />
    </div>

    <div id="alert-box" class="alert-box" role="alert"></div>

    <div id="step-phone">
      <h1 data-i18n="step1_title">Авторизация</h1>
      <p class="subtitle" data-i18n="step1_desc">
        Введите номер телефона. Сервис отправит код через официальный шлюз Telegram, а при недоступности — автоматически через SMS.
      </p>

      <form id="form-send">
        <div class="input-group">
          <label class="input-label" for="phone-input" data-i18n="phone_label">Номер телефона</label>
          <input
            type="tel"
            id="phone-input"
            class="tg-input"
            placeholder="+998 90 123 45 67"
            required
            autocomplete="tel"
          />
        </div>

        <button type="submit" id="send-btn" class="tg-btn" data-i18n="send_btn">
          Получить код
        </button>
      </form>
    </div>

    <div id="step-verify" class="hidden">
      <h1 data-i18n="step2_title">Введите код</h1>
      <p class="subtitle" id="verify-subtitle"></p>

      <form id="form-verify">
        <div class="input-group">
          <label class="input-label" for="code-input" data-i18n="code_label">Код подтверждения</label>
          <input
            type="text"
            id="code-input"
            class="tg-input code-input"
            placeholder="••••••"
            maxlength="6"
            inputmode="numeric"
            required
            autocomplete="one-time-code"
          />
        </div>

        <button type="submit" id="verify-btn" class="tg-btn" data-i18n="verify_btn">
          Подтвердить
        </button>
        <button type="button" id="change-phone-btn" class="tg-btn tg-btn-secondary" data-i18n="change_phone_btn">
          Изменить номер
        </button>
      </form>

      <p class="timer-text" id="timer-label"></p>
    </div>

    <div id="step-success" class="hidden">
      <h1 data-i18n="step3_title">✅ Номер подтверждён!</h1>
      <p class="subtitle" data-i18n="step3_desc">
        Проверка выполнена локально в Redis за ~1 мс без дополнительных сетевых запросов к внешним шлюзам.
      </p>

      <button type="button" id="test-again-btn" class="tg-btn" data-i18n="test_again_btn">
        Протестировать снова
      </button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
